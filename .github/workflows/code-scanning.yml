name: code-scanning

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  dockerfile-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Audit Dockerfile to SARIF
        # Findings must be uploaded even when the gate fails, otherwise a red
        # build hides the very annotations the reviewer needs.
        run: stow analyze Dockerfile --format sarif > dockerfile.sarif
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: dockerfile.sarif
          category: dockerfile-optimizer
